name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Info.plist
      - name: Run tests
        run: ./Tests/run.sh
      - name: Build the app bundle
        run: ./build.sh
      - name: Package
        run: |
          ditto -c -k --keepParent SpotLyrics.app "SpotLyrics-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "SpotLyrics-${GITHUB_REF_NAME}.zip" > "SpotLyrics-${GITHUB_REF_NAME}.zip.sha256"
      - name: Write the release notes
        run: |
          {
            echo "SpotLyrics ${GITHUB_REF_NAME}"
            echo
            echo "Requires macOS 26 or later. Download the zip, unzip it, and move SpotLyrics.app to /Applications."
            echo
            echo "This build is signed ad hoc and is not notarized, so macOS blocks it the first time."
            echo "Open it with a right-click on the app and choose Open, or remove the quarantine flag:"
            echo
            echo '    xattr -dr com.apple.quarantine /Applications/SpotLyrics.app'
            echo
            echo "Verify the download with the .sha256 file. See the commit history for what changed."
          } > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "SpotLyrics-${GITHUB_REF_NAME}.zip" \
            "SpotLyrics-${GITHUB_REF_NAME}.zip.sha256" \
            --title "SpotLyrics ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
